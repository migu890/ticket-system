name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticket_system_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ticket_system_test
      NODE_ENV: test

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Shared bauen
        run: npm run build -w shared

      - name: Prisma Client generieren
        working-directory: backend
        run: npx prisma generate

      - name: Testdatenbank vorbereiten
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Backend TypeScript prüfen
        working-directory: backend
        run: npx tsc --noEmit

      - name: Backend bauen
        run: npm run build -w backend

      - name: Backend Tests
        run: npm test -w backend

      - name: Frontend Typecheck
        run: npm run type-check -w frontend

      - name: Frontend Tests
        run: npm run test:unit -w frontend -- --run

      - name: Frontend bauen
        run: npm run build-only -w frontend